<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>Home-Cooked Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #FFF9F2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #2D4934;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            box-shadow: 0 4px 20px #00000010;
        }

        .emoji {
            font-size: 60px;
        }

        h1 {
            font-size: 28px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D5DDD5;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            background: #2D4934;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            color: #B91C1C;
            font-size: 14px;
        }

        .success {
            color: #15803D;
        }

        #resetForm {
            display: none;
            margin-top: 24px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="emoji">🍽️</div>

        <h1>Home-Cooked Marketplace</h1>

        <h2 id="status">Email Confirmation</h2>

        <p id="message">
            Please return to the Home-Cooked Marketplace
            app and log in to your account.
        </p>

        <form id="resetForm">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="resetButton">
                Update Password
            </button>

            <p id="feedback" class="error" role="alert"></p>

        </form>

    </div>

    <script>

        const EXPO_PUBLIC_SUPABASE_URL = 'https://ohzsltfdutrmcytlhaiu.supabase.co';

        const EXPO_PUBLIC_SUPABASE_KEY = 'sb_publishable_i3I-sf7VXzeAzbrOqruU-g_RnKFaWpB';

        const params = new URLSearchParams(
            window.location.hash.slice(1)
        );

        const query = new URLSearchParams(
            window.location.search
        );

        const status = document.getElementById('status');

        const message = document.getElementById('message');

        const resetForm = document.getElementById('resetForm');

        const resetButton = document.getElementById('resetButton');

        const feedback = document.getElementById('feedback');

        let accessToken = params.get('access_token');

        const type = params.get('type');

        history.replaceState(
            null,
            '',
            window.location.pathname
        );

        if (
            params.has('error') ||
            params.has('error_code') ||
            query.has('error') ||
            query.has('error_code')
        ) {

            accessToken = null;

            status.textContent = 'Link Invalid or Expired';

            message.textContent =
                'Please return to the app and request a new email.';

        } else if (
            type === 'recovery' &&
            accessToken
        ) {

            status.textContent = 'Reset Your Password';

            message.textContent =
                'Enter a new password for your Home-Cooked Marketplace account.';

            resetForm.style.display = 'block';

        } else if (
            type === 'signup' &&
            accessToken
        ) {

            status.textContent = 'Email Confirmed!';

            status.classList.add('success');

            message.textContent =
                'Your email has been confirmed. Please return to the app and log in.';

            accessToken = null;

        } else if (
            type === 'recovery' ||
            query.has('code')
        ) {

            status.textContent = 'Unable to Open Reset Link';

            message.textContent =
                'Please request a new password reset email from the app.';

        } else {

            accessToken = null;

        }

        resetForm.addEventListener('submit', async (event) => {

            event.preventDefault();

            feedback.textContent = '';

            const password =
                document.getElementById('password').value;

            const confirmPassword =
                document.getElementById('confirmPassword').value;

            if (password.length < 8) {

                feedback.textContent =
                    'Your password must contain at least 8 characters.';

                return;

            }

            if (password !== confirmPassword) {

                feedback.textContent =
                    'Your passwords do not match.';

                return;

            }

            if (!accessToken) {

                feedback.textContent =
                    'Your reset session has expired. Request a new link.';

                return;

            }

            resetButton.disabled = true;

            resetButton.textContent = 'Updating Password...';

            try {

                const response = await fetch(
                    `${EXPO_PUBLIC_SUPABASE_URL}/auth/v1/user`,
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': EXPO_PUBLIC_SUPABASE_KEY,
                            'Authorization': `Bearer ${accessToken}`
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );

                if (!response.ok) {

                    const data = await response.json();

                    throw new Error(
                        data.msg ||
                        data.message ||
                        'Unable to update your password.'
                    );

                }

                resetForm.reset();

                resetForm.style.display = 'none';

                status.textContent = 'Password Updated!';

                status.classList.add('success');

                message.textContent =
                    'Your password has been successfully changed. Return to the Home-Cooked Marketplace app and log in using your new password.';

                accessToken = null;

            } catch (error) {

                feedback.textContent =
                    error.message ||
                    'Something went wrong. Please try again.';

            } finally {

                resetButton.disabled = false;

                resetButton.textContent = 'Update Password';

            }

        });

    </script>

</body>
</html>
